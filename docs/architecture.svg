<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#003e89"/>
    </marker>
  </defs>

  <!-- スマートフォン -->
  <rect x="30" y="70" width="260" height="160" rx="6" fill="#eef2fa" stroke="#003e89" stroke-width="2.5"/>
  <text x="160" y="115" text-anchor="middle" font-size="24" font-weight="700" fill="#003e89">📱 スマートフォン</text>
  <text x="160" y="155" text-anchor="middle" font-size="18" fill="#1a1c1e">Canvas 指描き</text>
  <text x="160" y="185" text-anchor="middle" font-size="18" fill="#1a1c1e">PNG 正規化</text>

  <!-- Cloud Run -->
  <rect x="410" y="70" width="260" height="160" rx="6" fill="#eef2fa" stroke="#003e89" stroke-width="2.5"/>
  <text x="540" y="115" text-anchor="middle" font-size="24" font-weight="700" fill="#003e89">☁️ Cloud Run</text>
  <text x="540" y="155" text-anchor="middle" font-size="18" fill="#1a1c1e">FastAPI + Python</text>
  <text x="540" y="185" text-anchor="middle" font-size="18" fill="#1a1c1e">ルーブリック採点</text>

  <!-- Gemini -->
  <rect x="790" y="70" width="260" height="160" rx="6" fill="#eef2fa" stroke="#003e89" stroke-width="2.5"/>
  <text x="920" y="115" text-anchor="middle" font-size="24" font-weight="700" fill="#003e89">🤖 Gemini Flash Lite</text>
  <text x="920" y="155" text-anchor="middle" font-size="18" fill="#1a1c1e">特徴観察</text>
  <text x="920" y="185" text-anchor="middle" font-size="18" fill="#1a1c1e">true / false</text>

  <!-- スマホ ⇄ Cloud Run -->
  <line x1="295" y1="120" x2="402" y2="120" stroke="#003e89" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="350" y="105" text-anchor="middle" font-size="15" fill="#003e89">PNG 画像</text>
  <line x1="405" y1="180" x2="298" y2="180" stroke="#003e89" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="350" y="212" text-anchor="middle" font-size="15" fill="#003e89">合否・理由</text>

  <!-- Cloud Run ⇄ Gemini -->
  <line x1="675" y1="120" x2="782" y2="120" stroke="#003e89" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="730" y="105" text-anchor="middle" font-size="15" fill="#003e89">判定依頼</text>
  <line x1="785" y1="180" x2="678" y2="180" stroke="#003e89" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="730" y="212" text-anchor="middle" font-size="15" fill="#003e89">観察結果</text>
</svg>
