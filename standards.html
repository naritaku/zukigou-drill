<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>図記号一覧 — 配線用図記号ドリル</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="配線用図記号ドリル">
<meta property="og:title" content="図記号一覧 — 配線用図記号ドリル">
<meta property="og:description" content="JIS C 0303 の配線用図記号の名称・図・解説の一覧。第二次検定対策用。">
<meta property="og:url" content="__BASE_URL__standards">
<meta property="og:image" content="__BASE_URL__og.png">
<link rel="stylesheet" href="/theme.css">
<style>
  body { padding: 76px 16px 88px; }

  header {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: var(--page-max); z-index: 50;
    background: var(--card); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  }
  header a.home { color: var(--primary); display: flex; text-decoration: none; }
  header .tt { flex: 1; }
  header .tt .label-caps { color: var(--on-surface-variant); font-size: 9.5px; display: block; }
  header .tt h1 { font-size: 20px; font-weight: 700; color: var(--primary); line-height: 1.25; }
  header .count { font-family: var(--mono); font-size: 10px; color: var(--on-surface-variant); }

  .cat-head {
    display: flex; align-items: center; gap: 8px;
    color: var(--primary); margin: 22px 2px 10px;
  }
  .cat-head::before { content: ""; width: 4px; height: 14px; background: var(--primary); }
  .cat-head .label-caps { font-size: 12px; }
  .cat-head small { font-family: var(--mono); font-size: 10px; color: var(--on-surface-variant); }

  .sym { margin-bottom: 10px; overflow: hidden; }
  .sym .head {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; cursor: pointer;
  }
  .sym .thumb { width: 44px; height: 44px; flex: none; border: 1px solid var(--line); border-radius: 2px; padding: 3px; background: #fff; }
  .sym .thumb svg { width: 100%; height: 100%; }
  .sym .head b { font-size: 14px; color: var(--on-surface); flex: 1; line-height: 1.4; }
  .sym .head .material-symbols-outlined { color: var(--on-surface-variant); font-size: 20px; transition: transform .15s; }
  .sym.open .head .material-symbols-outlined { transform: rotate(180deg); }

  .sym .detail { display: none; border-top: 1px solid var(--line); }
  .sym.open .detail { display: block; }
  .sym .fig {
    display: flex; align-items: center; justify-content: center;
    padding: 14px; border-bottom: 1px solid var(--line);
  }
  .sym .fig svg { width: 120px; height: 120px; }
  .sym .desc { font-size: 12.5px; line-height: 1.75; padding: 12px 14px; color: var(--on-surface); }
  .sym .sect { padding: 0 14px 12px; }
  .sym .sect .label-caps { font-size: 9px; color: var(--primary); display: block; margin-bottom: 4px; }
  .sym .pt { font-size: 11.5px; line-height: 1.6; padding: 1px 0; display: flex; gap: 6px; }
  .sym .pt::before { content: "✎"; color: var(--primary); flex: none; }
  .sym .mist { font-size: 11px; line-height: 1.6; color: var(--ng); padding: 1px 0; }

  .foot-note {
    margin-top: 20px; font-family: var(--mono); font-size: 10px;
    line-height: 1.8; color: var(--on-surface-variant); text-align: center;
  }
</style>
</head>
<body>

<header>
  <a class="home" href="/"><span class="material-symbols-outlined">home</span></a>
  <div class="tt">
    <span class="label-caps">Standards</span>
    <h1>図記号一覧</h1>
  </div>
  <span class="count" id="count"></span>
</header>

<div id="list">読み込み中…</div>

<p class="foot-note">
  図・名称は JIS C 0303「構内電気設備の配線用図記号」を参照して作成。<br>
  本ページは学習用の参考資料であり、正式な確認は規格票によってください。
</p>

<nav class="bottomnav">
  <a class="tab active" href="/standards"><span class="material-symbols-outlined">menu_book</span><span class="label-caps">Standards</span></a>
  <a class="tab" href="/drill"><span class="material-symbols-outlined">exercise</span><span class="label-caps">Training</span></a>
  <a class="tab" href="#" onclick="return false"><span class="material-symbols-outlined">history</span><span class="label-caps">History</span><span class="soon">COMING SOON</span></a>
</nav>

<script>
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/catalog').then(r=>r.json()).then(list=>{
  document.getElementById('count').textContent = list.length + ' 記号';
  const cats = {};
  list.forEach(s => (cats[s.category] = cats[s.category] || []).push(s));
  const root = document.getElementById('list');
  root.innerHTML = '';
  for (const [cat, syms] of Object.entries(cats)) {
    const h = document.createElement('div');
    h.className = 'cat-head';
    h.innerHTML = `<span class="label-caps">${esc(cat)}</span><small>${syms.length}</small>`;
    root.appendChild(h);
    syms.forEach(s => {
      const el = document.createElement('div');
      el.className = 'sym card';
      el.innerHTML = `
        <div class="head">
          <div class="thumb">${s.ref_svg}</div>
          <b>${esc(s.name)}</b>
          <span class="material-symbols-outlined">expand_more</span>
        </div>
        <div class="detail">
          <div class="fig">${s.ref_svg}</div>
          <p class="desc">${esc(s.description)}</p>
          <div class="sect">
            <span class="label-caps">描き方のポイント</span>
            ${s.required_features.map(f=>`<div class="pt">${esc(f)}</div>`).join('')}
          </div>
          ${s.common_mistakes && s.common_mistakes.length ? `<div class="sect"><span class="label-caps">よくある誤り</span>${s.common_mistakes.map(m=>`<div class="mist">⚠ ${esc(m)}</div>`).join('')}</div>` : ''}
        </div>`;
      el.querySelector('.head').onclick = () => el.classList.toggle('open');
      root.appendChild(el);
    });
  }
}).catch(()=>{ document.getElementById('list').textContent = '読み込みに失敗しました'; });
</script>
</body>
</html>
