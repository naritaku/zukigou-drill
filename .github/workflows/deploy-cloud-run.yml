name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      gemini_models_free:
        description: Free-tier Gemini models (comma-separated)
        required: false
        default: gemini-3.1-flash-lite,gemini-3.5-flash
      gemini_models_paid:
        description: Paid-tier Gemini models (comma-separated)
        required: false
        default: gemini-3.1-flash-lite,gemini-3.5-flash
      max_instances:
        description: Cloud Run max instances
        required: true
        default: "2"
      rate_limit:
        description: Request rate limit per window
        required: false
        default: "20"
      rate_window:
        description: Rate limit window in seconds
        required: false
        default: "60"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: zukigou-drill-dojo
  REGION: asia-northeast1
  SERVICE_NAME: zukigou-drill

jobs:
  deploy:
    name: Deploy main to Cloud Run
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy from source
        run: |
          gcloud run deploy "$SERVICE_NAME" --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --max-instances "${{ inputs.max_instances }}" \
            --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --set-secrets "GEMINI_API_KEYS=GEMINI_API_KEYS:latest" \
            --set-secrets "GEMINI_PAID_API_KEY=GEMINI_PAID_API_KEY:latest" \
            --set-env-vars "GEMINI_MODELS_FREE=${{ inputs.gemini_models_free }}" \
            --set-env-vars "GEMINI_MODELS_PAID=${{ inputs.gemini_models_paid }}" \
            --set-env-vars "RATE_LIMIT=${{ inputs.rate_limit }}" \
            --set-env-vars "RATE_WINDOW=${{ inputs.rate_window }}"

      - name: Verify health endpoints
        run: |
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          echo "Service deployed at: $SERVICE_URL"
          curl -fsS "$SERVICE_URL/healthz" && echo "✓ /healthz OK"
          curl -fsS "$SERVICE_URL/readyz" && echo "✓ /readyz OK"
