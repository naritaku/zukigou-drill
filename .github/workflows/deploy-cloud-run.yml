name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      gemini_models_free:
        description: Free-tier Gemini models (comma-separated)
        required: false
        default: gemini-3.1-flash-lite,gemini-3.5-flash
      gemini_models_paid:
        description: Paid-tier Gemini models (comma-separated)
        required: false
        default: gemini-3.1-flash-lite,gemini-3.5-flash
      max_instances:
        description: Cloud Run max instances
        required: true
        default: "2"
      rate_limit:
        description: Request rate limit per window
        required: false
        default: "20"
      rate_window:
        description: Rate limit window in seconds
        required: false
        default: "60"
      all_judgments_bucket:
        description: GCS bucket for all judgments (empty disables saving)
        required: false
        default: ""
      feedback_bucket:
        description: GCS bucket for disputed reports (empty disables saving)
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: zukigou-drill-dojo
  REGION: asia-northeast1
  SERVICE_NAME: zukigou-drill
  # ランタイム SA。既定の compute SA は roles/editor を持つため使わない。
  # 付与するロールは scripts/setup-gcp-guardrails.sh runtime-sa を参照。
  RUNTIME_SA: zukigou-drill-run@zukigou-drill-dojo.iam.gserviceaccount.com

jobs:
  deploy:
    name: Deploy main to Cloud Run
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve available Gemini secrets
        id: secrets
        run: |
          # GEMINI_API_KEY 以外は任意。Secret Manager に無いものを指定すると
          # デプロイ全体が失敗するため、存在するものだけを渡す。
          if ! gcloud secrets describe GEMINI_API_KEY --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "::error::Secret GEMINI_API_KEY not found in project $PROJECT_ID"
            exit 1
          fi
          MAPPINGS="GEMINI_API_KEY=GEMINI_API_KEY:latest"
          for name in GEMINI_API_KEYS GEMINI_PAID_API_KEY; do
            if gcloud secrets describe "$name" --project "$PROJECT_ID" >/dev/null 2>&1; then
              MAPPINGS="${MAPPINGS},${name}=${name}:latest"
            else
              echo "::notice::Optional secret $name not found; skipping"
            fi
          done
          echo "mappings=${MAPPINGS}" >> "$GITHUB_OUTPUT"

      - name: Deploy from source
        run: |
          # --set-secrets / --set-env-vars は指定した集合で「置き換える」。
          # フラグを複数回書かず1つにまとめ、環境変数はすべてここで確定させる
          # （手動 gcloud update で足した値はデプロイ時に消えるため、
          #  バケット名も workflow_dispatch の入力として渡す）。
          gcloud run deploy "$SERVICE_NAME" --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --max-instances "${{ inputs.max_instances }}" \
            --set-secrets "${{ steps.secrets.outputs.mappings }}" \
            --set-env-vars "^|^GEMINI_MODELS_FREE=${{ inputs.gemini_models_free }}|GEMINI_MODELS_PAID=${{ inputs.gemini_models_paid }}|RATE_LIMIT=${{ inputs.rate_limit }}|RATE_WINDOW=${{ inputs.rate_window }}|ALL_JUDGMENTS_BUCKET=${{ inputs.all_judgments_bucket }}|FEEDBACK_BUCKET=${{ inputs.feedback_bucket }}"

      - name: Verify health endpoints
        run: |
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          echo "Service deployed at: $SERVICE_URL"
          # /healthz は Google のフロントエンドが握っていてコンテナに届かず 404 になる
          # （FastAPI ではなく Google の HTML エラーページが返る）。疎通確認は
          # 記録も Gemini キーも見る /readyz で行う。
          curl -fsS "$SERVICE_URL/readyz" && echo "✓ /readyz OK"
