<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>配線用図記号ドリル — TRAINING</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="配線用図記号ドリル">
<meta property="og:title" content="配線用図記号ドリル — TRAINING">
<meta property="og:description" content="指で描いて、AIが特徴ごとに検図。JIS C 0303の図記号をログイン不要で練習できる第二次検定対策ドリル。">
<meta property="og:url" content="__BASE_URL__drill">
<meta property="og:image" content="__BASE_URL__og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/theme.css">
<style>
  body { padding: 86px 16px 156px; }
  body.reviewed { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

  /* ---- fixed header ---- */
  header {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: var(--page-max); z-index: 50;
    background: var(--card); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
  }
  header a.home { color: var(--primary); display: flex; text-decoration: none; }
  header .tt { flex: 1; min-width: 0; }
  header .tt .label-caps { color: var(--on-surface-variant); font-size: 9.5px; display: block; }
  header .tt h1 { font-size: 20px; font-weight: 700; color: var(--primary); line-height: 1.25; }
  header .cat { font-family: var(--mono); font-size: 10px; color: var(--on-surface-variant); text-align: right; }
  header .skip { background: none; border: none; color: var(--primary); cursor: pointer; display: flex; }

  /* ---- canvas ---- */
  .canvas-wrap { border: 1.5px solid var(--primary); background: #fff; border-radius: 2px; }
  body.reviewed .canvas-wrap,
  body.reviewed .tools,
  body.reviewed .submitbar { display: none; }
  canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }

  #errbox {
    display: none; margin-top: 12px; padding: 12px 14px;
    border: 1px dashed var(--ng); background: #fff;
    font-family: var(--mono); font-size: 12px; color: var(--ng); line-height: 1.6;
  }

  /* ---- report ---- */
  .report { margin-top: 14px; display: none; }
  .report.show { display: block; }
  .rhead {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  .rhead b { font-size: 17px; color: var(--primary); }
  .verdict { font-size: 22px; font-weight: 800; line-height: 1; }
  .verdict.pass { color: var(--ok); }
  .verdict.fail { color: var(--ng); }
  .rhead .score { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--on-surface-variant); }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; border-bottom: 1px solid var(--line); }
  .compare figure { border: 1px solid var(--line); }
  .compare figure.ref { border-color: var(--primary); }
  .compare figcaption { padding: 5px 8px; background: var(--primary-tint); border-bottom: 1px solid var(--line); }
  .compare figure.ref figcaption { background: var(--primary); }
  .compare figure.ref figcaption .label-caps { color: #fff; }
  .compare .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #fff; }
  .compare img, .compare svg { width: 100%; height: 100%; object-fit: contain; padding: 10px; }

  .checklist-toggle {
    border-bottom: 1px solid var(--line);
  }
  .checklist-toggle summary {
    list-style: none;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--primary-tint);
    color: var(--primary);
    cursor: pointer;
    user-select: none;
  }
  .checklist-toggle summary::-webkit-details-marker { display: none; }
  .checklist-toggle summary::after {
    content: "expand_more";
    font-family: "Material Symbols Outlined";
    font-size: 20px;
    font-weight: normal;
    line-height: 1;
  }
  .checklist-toggle[open] summary::after { content: "expand_less"; }
  .checklist-summary {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--on-surface-variant);
    letter-spacing: .04em;
  }
  .check { display: flex; gap: 12px; padding: 13px 14px; align-items: flex-start; border-bottom: 1px solid var(--line); }
  .check .mark {
    width: 22px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; line-height: 1;
  }
  .check.ok .mark { color: var(--ok); }
  .check.ng .mark { color: var(--ng); }
  .check span:last-child { font-size: 13px; line-height: 1.65; padding-top: 1px; }
  .mistake { font-size: 12.5px; color: var(--ng); padding: 10px 14px 0; }
  /* 判定後に出す記号の解説。第二次検定では記号から名称と用途を答えるため、
     解答とお手本の図の直上に置いて、図・名称・説明を一目で結び付ける。 */
  .symbol-desc {
    font-size: 12.5px; line-height: 1.75; color: var(--on-surface);
    background: var(--surface-variant, #eef2fa);
    border-left: 3px solid var(--primary, #003e89);
    border-radius: 2px;
    margin: 12px 12px 0; padding: 10px 12px;
  }
  .symbol-desc:empty { display: none; }
  .symbol-desc b { color: var(--primary, #003e89); }
  .obs {
    display: flex; gap: 6px; align-items: flex-start;
    font-size: 11.5px; color: var(--on-surface-variant);
    padding: 12px 14px 6px; line-height: 1.7;
  }
  .obs .material-symbols-outlined { font-size: 15px; margin-top: 1px; }
  .dispute-row { padding: 0 14px 8px; }
  #dispute {
    background: none; border: none; padding: 4px 0; cursor: pointer;
    font-family: var(--mono); font-size: 10.5px; color: var(--on-surface-variant);
    text-decoration: underline; letter-spacing: .04em;
  }
  .actions { display: flex; gap: 8px; padding: 12px 14px 14px; }
  body.reviewed .actions {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: var(--page-max);
    box-sizing: border-box;
    z-index: 60;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    background: var(--card);
    border-top: 1px solid var(--line);
    box-shadow: 0 -8px 24px rgba(10, 30, 60, .08);
  }
  #retry { flex: 1; }
  #goNext { flex: 1.5; }

  /* ---- bottom bars ---- */
  .tools {
    position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: var(--page-max); z-index: 50;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--card); border-top: 1px solid var(--line);
  }
  .submitbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: var(--page-max); z-index: 50;
    padding-bottom: env(safe-area-inset-bottom); background: var(--primary);
  }
  .submitbar button { width: 100%; font-size: 14px; letter-spacing: .14em; }
  .judge-spinner {
    width: 18px; height: 18px;
    border: 2px solid currentColor; border-top-color: transparent;
    border-radius: 50%; display: inline-block;
    animation: judge-spin .8s linear infinite;
  }
  @keyframes judge-spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="/"><span class="material-symbols-outlined">home</span></a>
  <div class="tt">
    <span class="label-caps">Task Subject</span>
    <h1 id="qName">読み込み中…</h1>
  </div>
  <div class="cat" id="qCat"></div>
  <button class="skip" id="next" title="次の課題"><span class="material-symbols-outlined">skip_next</span></button>
</header>

<div class="canvas-wrap"><canvas id="cv"></canvas></div>

<div id="errbox"></div>

<section class="report card" id="report">
  <div class="rhead"><b>AIチェック結果</b><span class="verdict" id="verdict"></span><span class="score" id="score"></span></div>
  <p class="symbol-desc" id="symbolDesc"></p>
  <div class="compare" id="compare" style="display:none">
    <figure>
      <figcaption><span class="label-caps">あなたの解答</span></figcaption>
      <div class="cell"><img id="yourImg" alt="あなたの解答"></div>
    </figure>
    <figure class="ref">
      <figcaption><span class="label-caps">お手本</span></figcaption>
      <div class="cell"><div id="refSvg"></div></div>
    </figure>
  </div>
  <details class="checklist-toggle" id="checklistToggle">
    <summary><span class="label-caps">Checklist Criteria</span><span class="checklist-summary" id="checklistSummary"></span></summary>
    <div id="checks"></div>
  </details>
  <div id="mistakes"></div>
  <p class="obs"><span class="material-symbols-outlined">info</span><span id="obs"></span></p>
  <p class="disclaimer">AIによる練習用チェックです。図記号としての正しさは保証しません。正式には JIS C 0303 を確認してください。</p>
  <div class="dispute-row">
    <button id="dispute">判定に納得できない(匿名で報告)</button>
  </div>
  <footer class="actions" aria-label="結果画面の操作">
    <button id="retry" class="btn btn-secondary">もう一度描く</button>
    <button id="goNext" class="btn btn-primary">次の課題<span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span></button>
  </footer>
</section>

<div class="tools">
  <button class="iconbtn" id="clear"><span class="material-symbols-outlined">mop</span><span class="label-caps">Clear</span></button>
  <button class="iconbtn" id="undo"><span class="material-symbols-outlined">undo</span><span class="label-caps">Undo</span></button>
  <button class="iconbtn" id="redo"><span class="material-symbols-outlined">redo</span><span class="label-caps">Redo</span></button>
  <button class="iconbtn" id="eraser"><span class="material-symbols-outlined">ink_eraser</span><span class="label-caps">Eraser</span></button>
  <button class="iconbtn active" id="pen"><span class="material-symbols-outlined">stylus_note</span><span class="label-caps">Pen</span></button>
</div>
<div class="submitbar">
  <button class="btn btn-primary" id="judge"><span class="material-symbols-outlined" style="font-size:18px">play_arrow</span>判定する</button>
</div>

<script>
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let dpr = window.devicePixelRatio || 1;
let drawing = false, tool = "pen", strokes = [], redoStack = [], current = null;
let q = null, lastImg = null, lastSubmittedImg = null, lastJudgment = null, judging = false;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || cv.parentElement.clientWidth;
  // 判定結果の表示中は CSS でキャンバスを隠している。モバイルブラウザの
  // ツールバー開閉などでこの間に resize が発火しても、描画領域を 0px に
  // 潰さない。再表示時に resetDrawingState が実寸でリサイズする。
  if (!w) return;
  const h = Math.round(w * 0.9);
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw() {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.lineCap = ctx.lineJoin = "round";
  for (const s of strokes) {
    ctx.strokeStyle = s.tool === "pen" ? "#1a1c1e" : "#ffffff";
    ctx.lineWidth = s.tool === "pen" ? 3.5 : 24;
    ctx.beginPath();
    s.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.stroke();
  }
}
function pos(e) {
  const r = cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return [t.clientX - r.left, t.clientY - r.top];
}
function down(e) { e.preventDefault(); drawing = true; current = { tool, pts: [pos(e)] }; strokes.push(current); redoStack = []; }
function move(e) { if (!drawing) return; e.preventDefault(); current.pts.push(pos(e)); redraw(); }
function up() { drawing = false; current = null; }

cv.addEventListener("mousedown", down); cv.addEventListener("mousemove", move);
window.addEventListener("mouseup", up);
cv.addEventListener("touchstart", down, { passive: false });
cv.addEventListener("touchmove", move, { passive: false });
cv.addEventListener("touchend", up);
window.addEventListener("resize", resize);

const $ = id => document.getElementById(id);
function setTool(t) {
  tool = t;
  $("pen").classList.toggle("active", t === "pen");
  $("eraser").classList.toggle("active", t === "eraser");
}
$("pen").onclick = () => setTool("pen");
$("eraser").onclick = () => setTool("eraser");
$("undo").onclick = () => { const s = strokes.pop(); if (s) redoStack.push(s); redraw(); };
$("redo").onclick = () => { const s = redoStack.pop(); if (s) strokes.push(s); redraw(); };
$("clear").onclick = () => { strokes = []; redoStack = []; lastSubmittedImg = null; redraw(); hideReport(); };
$("next").onclick = () => { if (!judging) loadQuestion(); };
$("goNext").onclick = () => { if (!judging) loadQuestion(); };
function scrollToPageTop() {
  // 表示内容の切り替えによるレイアウト更新後に、固定ヘッダーを含むページ先頭を表示する。
  requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: "auto" }));
}
function resetDrawingState({ scrollTop = false } = {}) {
  hideReport();
  strokes = [];
  redoStack = [];
  lastSubmittedImg = null;
  // 結果画面で非表示だったキャンバスが resize イベントに追従できなかった
  // 場合も、次の問題・解き直しでは必ず現在の表示幅に復元する。
  resize();
  if (scrollTop) {
    // レビュー結果までスクロールした位置を残すと、再描画時にキャンバス下部だけが表示されて
    // 入力位置がずれて見えるため、描画面の先頭へ戻してから描き直せるようにする。
    scrollToPageTop();
  }
}
$("retry").onclick = () => { if (!judging) resetDrawingState({ scrollTop: true }); };

function showError(msg) {
  const e = $("errbox"); e.textContent = msg; e.style.display = "block";
}
function hideReport() {
  document.body.classList.remove("reviewed");
  $("errbox").style.display = "none";
  $("report").classList.remove("show");
}

async function loadQuestion() {
  resetDrawingState();
  q = await (await fetch("/api/question")).json();
  $("qName").textContent = q.name;
  $("qCat").textContent = "JIS C 0303\n" + q.category;
  $("qCat").innerHTML = "JIS C 0303<br>" + q.category;
  scrollToPageTop();
}

/* 送信前正規化: 白背景化 → 描画範囲トリミング → 余白付き512px */
function exportImage() {
  const w = cv.width, h = cv.height;
  const data = ctx.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = 0, maxY = 0, found = false;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
    if (data[(y * w + x) * 4] < 200) {
      found = true;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  if (!found) return null;
  const pad = 24 * dpr;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(w, maxX + pad); maxY = Math.min(h, maxY + pad);
  const bw = maxX - minX, bh = maxY - minY, scale = 512 / Math.max(bw, bh);
  const out = document.createElement("canvas");
  out.width = Math.round(bw * scale); out.height = Math.round(bh * scale);
  const octx = out.getContext("2d");
  octx.fillStyle = "#fff"; octx.fillRect(0, 0, out.width, out.height);
  octx.drawImage(cv, minX, minY, bw, bh, 0, 0, out.width, out.height);
  return out.toDataURL("image/png");
}

function setBusy(busy) {
  judging = busy;
  for (const id of ["judge", "next", "goNext", "retry", "clear", "undo", "redo", "eraser", "pen"]) {
    const el = $(id);
    if (el) el.disabled = busy;
  }
}

function apiErrorMessage(status) {
  if (status === 429) return "判定回数の上限に達しました。少し待ってから再試行してください。";
  if (status === 413) return "画像サイズが大きすぎます。描画を簡略化して再試行してください。";
  if (status === 400) return "画像を処理できませんでした。描き直して再試行してください。";
  if (status === 503) return "判定サービスを利用できません。少し時間をおいて再試行してください。";
  return "判定に失敗しました。少し時間をおいて再試行してください。";
}

$("judge").onclick = async () => {
  if (judging || !q) return;
  const img = exportImage();
  if (!img) { showError("何か描いてから判定してください"); return; }
  if (img === lastSubmittedImg) {
    showError("前回から描画が変わっていません。修正してから判定してください");
    return;
  }

  const judgingSymbolId = q.id;
  lastImg = img;
  const btn = $("judge");
  const spinner = document.createElement("span");
  spinner.className = "judge-spinner";
  setBusy(true);
  btn.setAttribute("aria-busy", "true");
  btn.replaceChildren(spinner, document.createTextNode("判定中…"));
  $("errbox").style.display = "none";
  try {
    const res = await fetch("/api/judge", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbol_id: judgingSymbolId, image_b64: img }),
    });
    if (!res.ok) {
      showError(apiErrorMessage(res.status));
      return;
    }
    const result = await res.json();
    if (result.symbol_id !== judgingSymbolId) throw new Error("response symbol mismatch");
    lastSubmittedImg = img;
    render(result);
  } catch (e) {
    showError("判定結果を受信できませんでした。通信状態を確認して再試行してください。");
  } finally {
    setBusy(false);
    btn.removeAttribute("aria-busy");
    btn.replaceChildren();
    const icon = document.createElement("span");
    icon.className = "material-symbols-outlined";
    icon.style.fontSize = "18px";
    icon.textContent = "play_arrow";
    btn.append(icon, document.createTextNode("判定する"));
  }
};

function render(r) {
  lastJudgment = r;
  const d = $("dispute");
  d.textContent = "判定に納得できない(匿名で報告)";
  d.disabled = false;

  const v = $("verdict");
  v.textContent = r.passed ? "○" : "✕";
  v.className = "verdict " + (r.passed ? "pass" : "fail");
  $("score").textContent = r.score;

  const cmp = $("compare");
  $("yourImg").src = lastImg;
  if (r.ref_svg) {
    // ref_svg はリポジトリ内の検証済み問題データのみを使用する。
    $("refSvg").innerHTML = r.ref_svg;
  } else {
    $("refSvg").replaceChildren();
  }
  cmp.style.display = "grid";

  const checks = $("checks");
  const checklistToggle = $("checklistToggle");
  const failedChecks = r.checks.filter(item => !item.ok).length;
  $("checklistSummary").textContent = failedChecks ? `NG ${failedChecks}/${r.checks.length}` : `OK ${r.checks.length}/${r.checks.length}`;
  checklistToggle.open = false;
  checks.replaceChildren();
  for (const item of r.checks) {
    const row = document.createElement("div");
    row.className = `check ${item.ok ? "ok" : "ng"}`;
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = item.ok ? "○" : "✕";
    const feature = document.createElement("span");
    feature.textContent = item.feature;
    row.append(mark, feature);
    checks.append(row);
  }

  const mistakes = $("mistakes");
  mistakes.replaceChildren();
  for (const message of r.mistakes) {
    const row = document.createElement("div");
    row.className = "mistake";
    row.textContent = `⚠ ${message}`;
    mistakes.append(row);
  }
  const desc = $("symbolDesc");
  desc.replaceChildren();
  if (q && q.description) {
    const label = document.createElement("b");
    label.textContent = q.name + "：";
    desc.append(label, document.createTextNode(q.description));
  }
  $("obs").textContent = "観察: " + r.observation;
  document.body.classList.add("reviewed");
  $("report").classList.add("show");
  scrollToPageTop();
}

$("dispute").onclick = async () => {
  if (!lastImg || !lastJudgment) return;
  const d = $("dispute");
  d.disabled = true; d.textContent = "報告中…";
  try {
    const res = await fetch("/api/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbol_id: lastJudgment.symbol_id, image_b64: lastImg, judgment: {
        passed: lastJudgment.passed, checks: lastJudgment.checks,
        mistakes: lastJudgment.mistakes, observation: lastJudgment.observation
      }, issued_at: lastJudgment.issued_at, signature: lastJudgment.signature}),
    });
    d.textContent = res.ok ? "報告しました。改善に活用します" : "報告に失敗しました";
  } catch { d.textContent = "報告に失敗しました"; }
};

resize();
loadQuestion();
</script>
</body>
</html>
